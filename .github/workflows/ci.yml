name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore src/UnitTestingTutorial.slnx

      - name: Build
        run: dotnet build src/UnitTestingTutorial.slnx --no-restore

      - name: Testes
        run: dotnet test src/UnitTestingTutorial.slnx --no-build